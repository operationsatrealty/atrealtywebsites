<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-label="Tom McCartney portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#454545"/>
    </linearGradient>
    <linearGradient id="sq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE512"/>
      <stop offset="1" stop-color="#ffd400"/>
    </linearGradient>
  </defs>
  <rect width="640" height="800" fill="url(#bg)"/>
  <!-- accent corner square -->
  <rect x="0" y="0" width="120" height="120" fill="url(#sq)"/>
  <!-- stylised figure -->
  <g fill="#5a5a5a">
    <circle cx="320" cy="300" r="118"/>
    <path d="M150 760c0-104 76-188 170-188s170 84 170 188z"/>
  </g>
  <!-- monogram -->
  <circle cx="320" cy="300" r="118" fill="none" stroke="#FFE512" stroke-width="6"/>
  <text x="320" y="690" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-weight="700" font-size="64" fill="#ffffff">Tom McCartney</text>
  <text x="320" y="730" text-anchor="middle" font-family="'Lato',Arial,sans-serif" font-weight="600" font-size="22" letter-spacing="2" fill="#FFE512">RAY WHITE MANUREWA</text>
</svg>
